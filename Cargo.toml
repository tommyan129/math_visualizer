[workspace]
resolver = "3"
members = ["crates/dsl", "crates/model", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
dsl = { path = "crates/dsl" }
model = { path = "crates/model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1"
thiserror = "2"
ts-rs = "12"
